name: Rust CI

on:
  push:
    branches:
      - master
    tags:
      - 'V*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-05-09

jobs:
  rust:
    name: Rust ${{ matrix.name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            command: cargo fmt --all -- --check
          - name: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          - name: check
            command: cargo check --workspace --all-targets
          - name: test
            command: cargo test --workspace

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  bench:
    name: search-cache bench (large corpus)
    runs-on: macos-14
    # Run only on master push, manual trigger, or PRs with "perf:" title
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf:'))
    defaults:
      run:
        working-directory: search-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: search-cache

      # Blobless shallow clone: downloads tree objects + commits only,
      # so every file path exists on disk but no file content is fetched.
      # Result: ~60 MB instead of ~4 GB for a full linux clone.
      - name: Clone Linux kernel (blobless)
        run: |
          git clone \
            --depth=1 \
            --filter=blob:none \
            --no-tags \
            https://github.com/torvalds/linux \
            linux-corpus

      - name: Run benchmarks
        env:
          BENCH_CORPUS_DIR: ${{ github.workspace }}/search-cache/linux-corpus
        run: cargo bench --quiet --bench walk_and_search -- --output-format bencher | tee bench-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            search-cache/bench-output.txt
            search-cache/target/criterion/

  tauri:
    name: Tauri ${{ matrix.name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            command: cargo fmt -- --check
          - name: clippy
            command: cargo clippy --all-targets -- -D warnings
          - name: check
            command: cargo check --all-targets
          - name: test
            command: cargo test
    defaults:
      run:
        working-directory: cardinal/src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cardinal/src-tauri

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  macos-bundle:
    name: macOS application bundle
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/V') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-05-09
    defaults:
      run:
        working-directory: cardinal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cardinal/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cardinal/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build macOS release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --features tauri/custom-protocol --locked

      - name: Bundle macOS disk image
        run: npm run tauri bundle -- --bundles dmg --ci --no-sign --features tauri/custom-protocol

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/release/bundle/dmg"
          artifact_root="$GITHUB_WORKSPACE/cardinal-artifacts"
          mkdir -p "$artifact_root"

          while IFS= read -r dmg_path; do
            dmg_name="$(basename "$dmg_path")"
            if [[ "$GITHUB_REF_NAME" =~ ^V([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              release_tag="${GITHUB_REF_NAME#V}"
              architecture_suffix="${dmg_name##*_}"
              dmg_name="Cardinal_${release_tag}_${architecture_suffix}"
            fi
            cp "$dmg_path" "$artifact_root/$dmg_name"
          done < <(find "$bundle_root" -type f -name '*.dmg' -print)

          test -n "$(find "$artifact_root" -type f -print -quit)"
          find "$artifact_root" -type f -print

      - name: Upload macOS application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardinal-macos-${{ github.ref_name }}
          path: cardinal-artifacts/*
          if-no-files-found: error

      - name: Publish macOS disk image to GitHub Release
        if: startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: cardinal-artifacts/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
